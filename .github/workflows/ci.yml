name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate config/app.env (gitignored on purpose; synthetic lab credentials only)
        run: |
          mkdir -p config
          printf '%s\n' \
            'DATABASE_URL=postgresql://barq_app:BarqLabOnly_7qN2vK8c@postgres:5432/barq_tasks' \
            'REDIS_URL=redis://redis:6379/0' > config/app.env

      - name: Validate docker-compose.yml syntax
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for readiness (bounded wait)
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8080/ready | grep -q '"status":"ready"'; then
              echo "Service is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become ready within 60s"
          docker compose logs
          exit 1

      - name: Run validate.sh
        run: |
          chmod +x validate.sh
          ./validate.sh

      - name: Run failure_test.sh
        run: |
          chmod +x failure_test.sh
          ./failure_test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  security-scan:
    
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image for scanning
        run: docker build -t barq-app:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: barq-app:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
name: CD - build, push and deploy to Kubernetes

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  IMAGE: habibaeteam/barq-app-01

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to the cluster
    needs: build-push
    runs-on: self-hosted   # runner installed on the Kubernetes master
    steps:
      - name: Roll out the new image
        run: |
          kubectl set image deployment/app app=${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
          kubectl rollout status deployment/app --timeout=180s

      - name: Show what is running
        run: |
          kubectl get deploy app -o wide
          kubectl get pods -l app=app -o wide

      - name: Smoke test through nginx
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS http://192.168.57.100:30090/ ; echo
          done
